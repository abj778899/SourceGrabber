name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

    - name: Build iOS app
      run: |
        xcodebuild -project SourceGrabber.xcodeproj -scheme SourceGrabber -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=NO build

    - name: Package IPA
      run: |
        APP_PATH=$(find build/Build/Products -name "SourceGrabber.app" -type d | head -1)
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r SourceGrabber.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: SourceGrabber-ipa
        path: SourceGrabber.ipa
